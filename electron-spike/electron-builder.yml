appId: com.userinner.onpeople.electron-spike
productName: OnPeople Electron Spike
artifactName: onpeople-electron-spike-${version}-${arch}.${ext}
directories:
  output: dist-electron-spike
files:
  - dist/**/*
  - electron-spike/main.mjs
  - electron-spike/preload.cjs
  - electron-spike/rust-bridge.mjs
  - package.json
extraResources:
  - from: electron-spike/runtime
    to: .embedded-runtime
mac:
  category: public.app-category.developer-tools
  icon: assets/OnPeople.icns
  target:
    - dir
    - zip
  identity: null
asar: true
