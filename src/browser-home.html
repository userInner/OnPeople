<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnPeople 浏览器</title>
    <style>
      :root {
        color: #202124;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { display: grid; place-items: center; overflow: hidden; }
      main {
        width: min(340px, calc(100% - 48px));
        margin-top: -9vh;
        text-align: center;
      }
      .mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        margin: 0 auto 15px;
        border: 1px solid #e1e4e8;
        border-radius: 11px;
        background: #f8fafc;
        color: #4d725f;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -.04em;
      }
      h1 {
        margin: 0;
        color: #202124;
        font-size: 16px;
        font-weight: 620;
        letter-spacing: -.025em;
      }
      p {
        max-width: 310px;
        margin: 9px auto 0;
        color: #6f7680;
        font-size: 11px;
        line-height: 1.65;
      }
      .session {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 16px;
        padding: 6px 9px;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        background: #f7f9fb;
        color: #727a83;
        font-size: 9px;
      }
      .session::before {
        width: 6px;
        height: 6px;
        content: "";
        border-radius: 50%;
        background: #66947f;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">OP</div>
      <h1>内嵌浏览器已就绪</h1>
      <p>在地址栏输入网址或搜索内容。登录状态会保存在 OnPeople 的独立浏览器资料中。</p>
      <span class="session">当前任务可直接使用</span>
    </main>
  </body>
</html>
