name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - run: npm run check

  package-windows:
    name: Package Windows installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      CODEX_VERSION: "0.146.0-alpha.3.1"
      CUA_DRIVER_VERSION: "0.12.4"
      ONPEOPLE_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
      ONPEOPLE_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
      ONPEOPLE_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
      ONPEOPLE_STORE_APPLICATION_ID: ${{ vars.MS_STORE_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - name: Stage public Windows runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cache = Join-Path $env:RUNNER_TEMP "onpeople-runtime"
          $codexExtract = Join-Path $cache "codex"
          $cuaExtract = Join-Path $cache "cua"
          New-Item -ItemType Directory -Force $cache, $codexExtract, $cuaExtract, ".embedded-runtime\bin" | Out-Null

          $codexSpec = "@openai/codex@$env:CODEX_VERSION-win32-x64"
          $codexArchiveName = (npm pack $codexSpec --silent --pack-destination $cache | Select-Object -Last 1).Trim()
          $codexArchive = Join-Path $cache $codexArchiveName
          tar -xzf $codexArchive -C $codexExtract
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract $codexArchiveName" }
          $codexVendor = Join-Path $codexExtract "package\vendor\x86_64-pc-windows-msvc"
          Copy-Item "$codexVendor\*" -Destination ".embedded-runtime" -Recurse -Force

          $cuaAsset = "cua-driver-rs-$env:CUA_DRIVER_VERSION-windows-x86_64-binary.zip"
          $cuaRelease = "https://github.com/trycua/cua/releases/download/cua-driver-rs-v$env:CUA_DRIVER_VERSION"
          $cuaArchive = Join-Path $cache $cuaAsset
          $checksums = Join-Path $cache "cua-checksums.txt"
          Invoke-WebRequest "$cuaRelease/$cuaAsset" -OutFile $cuaArchive
          Invoke-WebRequest "$cuaRelease/checksums.txt" -OutFile $checksums
          $checksumLine = Get-Content $checksums | Where-Object { $_ -match [regex]::Escape($cuaAsset) } | Select-Object -First 1
          if (-not $checksumLine) { throw "Checksum for $cuaAsset was not published" }
          $expectedChecksum = ($checksumLine -split "\s+")[0].ToLowerInvariant()
          $actualChecksum = (Get-FileHash $cuaArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualChecksum -ne $expectedChecksum) { throw "Checksum mismatch for $cuaAsset" }
          Expand-Archive $cuaArchive -DestinationPath $cuaExtract -Force
          Copy-Item "$cuaExtract\*" -Destination ".embedded-runtime\bin" -Recurse -Force

          $codexBinary = ".embedded-runtime\bin\codex.exe"
          $cuaBinary = ".embedded-runtime\bin\cua-driver.exe"
          if (-not (Test-Path $codexBinary)) { throw "Codex executable was not staged" }
          if (-not (Test-Path $cuaBinary)) { throw "Cua Driver executable was not staged" }
          $manifest = @{
            createdAt = (Get-Date).ToUniversalTime().ToString("o")
            target = @{ platform = "win32"; arch = "x64" }
            components = @{
              codex = @{ kind = "npm"; version = $env:CODEX_VERSION; source = "npm:$codexSpec"; target = "bin/codex.exe"; sha256 = (Get-FileHash $codexBinary -Algorithm SHA256).Hash.ToLowerInvariant() }
              cuaDriver = @{ version = $env:CUA_DRIVER_VERSION; source = "$cuaRelease/$cuaAsset"; target = "bin/cua-driver.exe"; sha256 = (Get-FileHash $cuaBinary -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
            notice = "Public release runtimes downloaded from their official distributions during the build."
          }
          $manifestPath = Join-Path (Get-Location) ".embedded-runtime\manifest.json"
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Build and verify NSIS installer
        run: node scripts/package-win-installer.cjs
      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: OnPeople-Windows-x64
          path: |
            release/windows/OnPeople-Setup-*-win-x64.exe
            release/windows/OnPeople-Setup-*-win-x64.exe.blockmap
            release/windows/latest.yml
          if-no-files-found: error
          retention-days: 7
      - name: Build Microsoft Store AppX package
        if: env.ONPEOPLE_STORE_IDENTITY_NAME != ''
        run: node scripts/package-win-store.cjs
      - name: Upload Microsoft Store submission package
        if: env.ONPEOPLE_STORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v5
        with:
          name: OnPeople-Windows-Store-x64
          path: release/store/OnPeople-Store-*-win-x64.appx
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package macOS apps
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-15
    env:
      CODEX_NPM_VERSION: "0.146.0-alpha.3.1"
      CUA_DRIVER_VERSION: "0.12.4"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - name: Download and verify public universal macOS Cua Driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          runtime_cache="$RUNNER_TEMP/onpeople-runtime"
          cua_extract="$runtime_cache/cua"
          mkdir -p "$runtime_cache" "$cua_extract"

          cua_asset="cua-driver-rs-$CUA_DRIVER_VERSION-darwin-universal.tar.gz"
          cua_release="https://github.com/trycua/cua/releases/download/cua-driver-rs-v$CUA_DRIVER_VERSION"
          cua_archive="$runtime_cache/$cua_asset"
          checksums="$runtime_cache/cua-checksums.txt"
          curl --fail --location --retry 3 "$cua_release/$cua_asset" --output "$cua_archive"
          curl --fail --location --retry 3 "$cua_release/checksums.txt" --output "$checksums"
          expected_checksum="$(awk -v asset="$cua_asset" '$0 ~ asset { print $1; exit }' "$checksums")"
          actual_checksum="$(shasum -a 256 "$cua_archive" | awk '{ print $1 }')"
          test -n "$expected_checksum"
          test "$actual_checksum" = "$expected_checksum"
          tar -xzf "$cua_archive" -C "$cua_extract"
          cua_app="$(find "$cua_extract" -type d -name CuaDriver.app -print -quit)"
          test -x "$cua_app/Contents/MacOS/cua-driver"

          echo "CUA_DRIVER_APP_SOURCE=$cua_app" >> "$GITHUB_ENV"
      - name: Build, sign, and verify macOS archive
        run: npm run package:mac
      - name: Upload macOS app
        uses: actions/upload-artifact@v5
        with:
          name: OnPeople-macOS
          path: |
            release/OnPeople-*-macos-arm64.zip
            release/OnPeople-*-macos-arm64.dmg
            release/OnPeople-*-macos-x64.zip
            release/OnPeople-*-macos-x64.dmg
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-windows
      - package-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: OnPeople-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v$package_version"
          test "$TAG_NAME" = "$expected_tag"
          windows_installer="$(find release-assets -maxdepth 1 -name 'OnPeople-Setup-*-win-x64.exe' -print -quit)"
          windows_blockmap="$(find release-assets -maxdepth 1 -name 'OnPeople-Setup-*-win-x64.exe.blockmap' -print -quit)"
          windows_latest="release-assets/latest.yml"
          macos_arm64_archive="$(find release-assets -maxdepth 1 -name 'OnPeople-*-macos-arm64.zip' -print -quit)"
          macos_arm64_dmg="$(find release-assets -maxdepth 1 -name 'OnPeople-*-macos-arm64.dmg' -print -quit)"
          macos_x64_archive="$(find release-assets -maxdepth 1 -name 'OnPeople-*-macos-x64.zip' -print -quit)"
          macos_x64_dmg="$(find release-assets -maxdepth 1 -name 'OnPeople-*-macos-x64.dmg' -print -quit)"
          test -f "$windows_installer"
          test -f "$windows_blockmap"
          test -f "$windows_latest"
          test -f "$macos_arm64_archive"
          test -f "$macos_arm64_dmg"
          test -f "$macos_x64_archive"
          test -f "$macos_x64_dmg"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$windows_installer" "$windows_blockmap" "$windows_latest" "$macos_arm64_archive" "$macos_arm64_dmg" "$macos_x64_archive" "$macos_x64_dmg" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" "$windows_installer" "$windows_blockmap" "$windows_latest" "$macos_arm64_archive" "$macos_arm64_dmg" "$macos_x64_archive" "$macos_x64_dmg" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "OnPeople $package_version"
          fi
