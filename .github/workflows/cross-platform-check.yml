name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install browser used by end-to-end tests
        run: npx playwright install chromium
      - name: Prepare rollback-shell resource root
        run: |
          node -e "require('node:fs').mkdirSync('.embedded-runtime', { recursive: true })"
      - name: Verify source, contracts, tests, and production build
        run: npm run check
