appId: com.userinner.onpeople
productName: OnPeople
copyright: Copyright (c) 2026 OnPeople contributors
asar: true
compression: normal
npmRebuild: false
directories:
  output: release/windows
publish:
  provider: github
  owner: userInner
  repo: OnPeople
files:
  - src/**/*
  - assets/**/*
  - package.json
  - README.md
  - THIRD_PARTY_NOTICES.md
  - "!**/.DS_Store"
  - "!**/*.map"
  - "!.embedded-runtime{,/**/*}"
extraResources:
  - from: .embedded-runtime
    to: .embedded-runtime
asarUnpack:
  - node_modules/node-pty/**/*
protocols:
  - name: OnPeople
    schemes:
      - onpeople
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/OnPeople.ico
  executableName: OnPeople
  requestedExecutionLevel: asInvoker
  artifactName: OnPeople-Setup-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: OnPeople
  shortcutName: OnPeople
  uninstallDisplayName: OnPeople
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: true
