[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/onpeople-types",
  "crates/desktop-api",
  "crates/core-runtime",
  "crates/storage",
  "crates/workspace",
  "crates/browser-host",
  "crates/mcp-host",
  "crates/onpeople-cli",
  "crates/integrations",
  "xtask",
]
default-members = [
  "src-tauri",
  "crates/onpeople-types",
  "crates/desktop-api",
  "crates/core-runtime",
  "crates/storage",
  "crates/workspace",
  "crates/integrations",
  "crates/mcp-host",
  "crates/onpeople-cli",
  "xtask",
]

[workspace.package]
version = "0.30.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
authors = ["OnPeople"]

[workspace.dependencies]
aes = "0.8.4"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "1.11.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
chrono = { version = "0.4.44", features = ["serde"] }
directories = "6.0.0"
futures-util = "0.3.32"
globset = "0.4.18"
hex = "0.4.3"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store", "windows-native-keyring-store"] }
notify = "8.2.0"
once_cell = "1.21.3"
parking_lot = "0.12.5"
pbkdf2 = "0.12.2"
portable-pty = "0.9.0"
quick-xml = { version = "0.39.2", features = ["serialize"] }
rand = "0.9.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "form", "json", "multipart", "rustls", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
rrule = "0.14.0"
rusqlite = { version = "0.39.0", features = ["bundled", "chrono", "serde_json", "backup"] }
rusty-leveldb = "4.0.1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.26.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.8", features = ["limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.21.0", features = ["serde", "v4", "v7"] }
walkdir = "2.5.0"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
assigning_clones = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
field_reassign_with_default = "allow"
collapsible_if = "allow"
duration_suboptimal_units = "allow"
format_push_string = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
items_after_statements = "allow"
map_unwrap_or = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
transmute_ptr_to_ptr = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
while_let_loop = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
